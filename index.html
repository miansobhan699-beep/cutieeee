<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>💕 Letter for Antel Hayat · Kharoos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 20%, #1f0e12, #0d0508);
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 0.8rem;
      position: relative;
      overflow-x: hidden;
    }

    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.8rem;
      animation: floatUp linear infinite;
      opacity: 0.5;
      user-select: none;
      will-change: transform;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg) scale(0.7); opacity: 0.7; }
      100% { transform: translateY(-10vh) rotate(720deg) scale(1.1); opacity: 0; }
    }

    #surprise-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: fireworkExplode 1.5s ease-out forwards;
    }

    @keyframes fireworkExplode {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
    }

    .sparkle {
      position: absolute;
      font-size: 1.5rem;
      animation: sparkleFloat 2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes sparkleFloat {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    .surprise-message-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .surprise-message-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .surprise-message-box {
      background: rgba(25, 12, 16, 0.92);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 2px solid rgba(255, 200, 200, 0.3);
      box-shadow: 0 0 80px rgba(255, 80, 80, 0.3);
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
    }

    @keyframes popIn {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .surprise-message-box h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #ffe2e2, #ffb0b0, #ff6b81);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .surprise-message-box p {
      color: #f5e6e6;
      font-size: 1.1rem;
      line-height: 1.8;
      margin: 1rem 0;
    }

    .surprise-message-box .big-heart {
      font-size: 3rem;
      animation: floatHeart 2s infinite alternate;
      display: inline-block;
    }

    .surprise-close-btn {
      background: linear-gradient(135deg, #ff4d6d, #d6284a);
      border: none;
      border-radius: 60px;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 25px rgba(214, 40, 74, 0.4);
      pointer-events: auto;
    }

    .surprise-close-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #ff5a7a, #e02a4e);
    }

    .book {
      max-width: 820px;
      width: 100%;
      background: rgba(25, 12, 16, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.5rem 2.5rem 2rem 2rem;
      padding: 1.2rem 1rem 1.5rem 1rem;
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 180, 180, 0.15);
      border: 1px solid rgba(255, 200, 200, 0.08);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .book::after {
      content: '';
      position: absolute;
      top: -30%;
      left: -10%;
      width: 140%;
      height: 140%;
      background: radial-gradient(ellipse at 30% 40%, rgba(255, 100, 100, 0.06), transparent 70%);
      pointer-events: none;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-wrap: nowrap;
      gap: 0.5rem;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .page-indicator {
      background: rgba(255, 220, 220, 0.06);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 180, 180, 0.15);
      color: #f0d0d0;
      font-weight: 300;
      letter-spacing: 1px;
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .page-indicator i { color: #ff7b7b; margin-right: 4px; }

    .nav-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: rgba(255, 200, 200, 0.04);
      border: 1px solid rgba(255, 180, 180, 0.2);
      color: #f0d6d6;
      padding: 0.5rem 1rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 400;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
      min-width: 65px;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      z-index: 20;
      pointer-events: auto !important;
    }

    .nav-btn i { font-size: 0.85rem; color: #ff8a8a; pointer-events: none; }

    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 140, 140, 0.25);
    }

    .nav-btn:disabled { 
      opacity: 0.3; 
      pointer-events: none !important; 
      filter: grayscale(0.5); 
    }

    .page-container {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.2rem 0;
      position: relative;
      z-index: 2;
    }

    .page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeSlide 0.3s ease forwards;
    }

    @keyframes fadeSlide {
      0% { opacity: 0.3; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .page-icon {
      font-size: 2.8rem;
      color: #ff7b7b;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 30px rgba(255, 80, 80, 0.3);
      animation: floatHeart 3s infinite alternate;
    }

    @keyframes floatHeart {
      0% { transform: translateY(0); }
      100% { transform: translateY(-7px); }
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffe2e2, #ffb0b0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .page-sub {
      font-size: 0.85rem;
      color: #ddc0c0;
      font-weight: 300;
      letter-spacing: 2px;
      border-top: 1px solid rgba(255, 200, 200, 0.1);
      border-bottom: 1px solid rgba(255, 200, 200, 0.1);
      display: inline-block;
      padding: 0.15rem 1.2rem;
      backdrop-filter: blur(4px);
      border-radius: 60px;
      margin-bottom: 0.5rem;
      background: rgba(255, 200, 200, 0.02);
    }

    .page-body {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f5e6e6;
      font-weight: 350;
      max-width: 600px;
      margin: 0.3rem auto;
      padding: 0 0.3rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .page-body i { color: #ff6b81; margin: 0 4px; }
    .page-body .highlight {
      font-weight: 600;
      background: linear-gradient(135deg, #ffb3b3, #ff7b7b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 1.3rem;
    }

    .envelope-container {
      width: 100%;
      max-width: 350px;
      margin: 0.2rem auto;
      perspective: 800px;
      cursor: pointer;
    }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1.4 / 1;
      background: linear-gradient(145deg, #f5d6d6, #e8b4b4);
      border-radius: 8px 8px 12px 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), inset 0 -4px 15px rgba(180, 80, 80, 0.2);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .envelope.open { transform: rotateX(0deg) scale(1); }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(145deg, #f0d0d0, #dbb0b0);
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      border-bottom: 3px solid rgba(180, 80, 80, 0.15);
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: top center;
      z-index: 3;
    }

    .envelope.open .envelope-flap { transform: rotateX(180deg); }

    .envelope-body {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(145deg, #f5d6d6, #e0b8b8);
      border-top: 3px solid rgba(180, 80, 80, 0.1);
      border-radius: 0 0 8px 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .envelope-heart {
      font-size: 1.8rem;
      color: #c0392b;
      opacity: 0.4;
      animation: pulseEnvelope 2s infinite ease-in-out;
    }

    @keyframes pulseEnvelope {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    .wax-seal {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      background: radial-gradient(circle at 30% 30%, #d6284a, #8b1a2b);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 -3px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
      font-size: 1rem;
      color: #ffd700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 215, 0, 0.2);
    }

    .letter-content {
      position: absolute;
      top: 8%;
      left: 6%;
      width: 88%;
      height: 84%;
      background: linear-gradient(135deg, #fef9f0, #fdf3e6);
      border-radius: 6px;
      padding: 1rem;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
      transform: scale(0.85) translateY(10px);
      opacity: 0;
      z-index: 1;
      overflow-y: auto;
      text-align: left;
      color: #2c1810;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .envelope.open .letter-content {
      transform: scale(1) translateY(0);
      opacity: 1;
      z-index: 4;
    }

    .letter-content h2 {
      font-size: 1rem;
      color: #8b1a2b;
      text-align: center;
      margin-bottom: 0.4rem;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
    }

    .letter-content .letter-greeting {
      font-size: 0.9rem;
      font-weight: 600;
      color: #5c2e2e;
      margin-bottom: 0.3rem;
    }

    .letter-content p {
      font-size: 0.78rem;
      line-height: 1.6;
      color: #3d2a1e;
      margin-bottom: 0.4rem;
      text-align: justify;
    }

    .letter-content .letter-signature {
      text-align: right;
      font-size: 0.9rem;
      font-weight: 600;
      color: #8b1a2b;
      margin-top: 0.3rem;
      font-style: italic;
    }

    .letter-content .letter-hearts {
      text-align: center;
      font-size: 1rem;
      color: #c0392b;
      margin-top: 0.2rem;
    }

    .open-btn {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ff4d6d, #c0392b);
      border: none;
      border-radius: 60px;
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 25px rgba(192, 57, 43, 0.5);
      z-index: 6;
      letter-spacing: 1px;
      touch-action: manipulation;
    }

    .open-btn:hover {
      transform: translateX(-50%) scale(1.08);
      background: linear-gradient(135deg, #ff5a7a, #d44637);
      box-shadow: 0 12px 35px rgba(192, 57, 43, 0.7);
    }

    .open-btn:active { transform: translateX(-50%) scale(0.95); }
    .open-btn.hidden { opacity: 0; pointer-events: none; }

    .answer-section {
      width: 100%;
      max-width: 400px;
      margin: 0.5rem auto 0.2rem auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      z-index: 5;
    }

    .answer-box {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 180, 180, 0.25);
      background: rgba(255, 220, 220, 0.05);
      backdrop-filter: blur(4px);
      color: #f5e6e6;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
      -webkit-user-select: text !important;
      user-select: text !important;
      touch-action: manipulation;
      z-index: 10;
      position: relative;
      caret-color: #ff6b81;
    }

    .answer-box::placeholder {
      color: #a07a7a;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .answer-box:focus {
      border-color: #ff6b81;
      background: rgba(255, 220, 220, 0.1);
      box-shadow: 0 0 25px rgba(255, 80, 80, 0.15);
    }

    .reply-btn {
      background: linear-gradient(135deg, #ff4d6d, #d6284a);
      border: none;
      border-radius: 60px;
      padding: 0.4rem 1.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(214, 40, 74, 0.4);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .reply-btn:active { transform: scale(0.95); }

    .reply-feedback {
      color: #f0d0d0;
      font-size: 0.85rem;
      margin-top: 0.2rem;
      opacity: 0;
      transition: opacity 0.4s ease;
      min-height: 1rem;
    }

    .reply-feedback.show { opacity: 1; }

    /* ===== MOBILE NEXT BUTTON ===== */
    .mobile-next-section {
      width: 100%;
      max-width: 400px;
      margin: 0.5rem auto 0.2rem auto;
      display: none;
      justify-content: center;
    }

    .mobile-next-btn {
      background: linear-gradient(135deg, #ff6b81, #d6284a);
      border: none;
      border-radius: 60px;
      padding: 0.7rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 25px rgba(214, 40, 74, 0.4);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
      width: 100%;
      justify-content: center;
    }

    .mobile-next-btn:active { transform: scale(0.95); }
    .mobile-next-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* Mobile only - show extra next button */
    @media (max-width: 768px) {
      .mobile-next-section {
        display: flex !important;
      }
    }

    .flower-section {
      width: 100%;
      margin: 0.3rem auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .bouquet-container {
      position: relative;
      width: 100%;
      max-width: 260px;
      height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: scale(0.7);
      margin: 0 auto;
    }

    .bouquet-container.zoom-in { transform: scale(1.1); }

    .bouquet-emoji {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 0 40px rgba(255, 80, 80, 0.3));
      animation: floatBouquet 3s infinite alternate ease-in-out;
      text-align: center;
      transition: font-size 0.8s ease;
    }

    @keyframes floatBouquet {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-10px) rotate(3deg); }
    }

    .bouquet-text {
      font-size: 1rem;
      color: #f5e6e6;
      font-weight: 300;
      letter-spacing: 2px;
      margin-top: 0.1rem;
      text-shadow: 0 0 20px rgba(255, 80, 80, 0.2);
    }

    .accept-btn {
      background: linear-gradient(135deg, #ff6b81, #c0392b);
      border: none;
      border-radius: 60px;
      padding: 0.6rem 1.8rem;
      font-size: 1rem;
      font-weight: 700;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.4s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 35px rgba(192, 57, 43, 0.5);
      margin-top: 0.1rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .accept-btn:active { transform: scale(0.95); }
    .accept-btn.accepted { opacity: 0.7; cursor: default; background: #4CAF50; }
    .accept-btn.accepted:hover { transform: scale(1); background: #4CAF50; }

    .accept-feedback {
      color: #ffb0b0;
      font-size: 0.95rem;
      font-weight: 400;
      margin-top: 0.2rem;
      opacity: 0;
      transition: opacity 0.6s ease;
      text-shadow: 0 0 30px rgba(255, 80, 80, 0.3);
    }

    .accept-feedback.show {
      opacity: 1;
      animation: celebrate 0.6s ease;
    }

    @keyframes celebrate {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .continue-section {
      width: 100%;
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .continue-btn {
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 60px;
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 25px rgba(46, 125, 50, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.3s ease;
    }

    .continue-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    .continue-btn:active { transform: scale(0.95); }

    .restart-section {
      width: 100%;
      margin-top: 0.8rem;
      display: flex;
      justify-content: center;
    }

    .restart-btn {
      background: linear-gradient(135deg, #ff6b81, #c0392b);
      border: none;
      border-radius: 60px;
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff5f5;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;

          sparkle.className = 'sparkle';
          sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
          sparkle.style.left = Math.random() * 100 + '%';
          sparkle.style.top = Math.random() * 100 + '%';
          sparkle.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
          container.appendChild(sparkle);
          setTimeout(() => { if (sparkle.parentNode) sparkle.remove(); }, 2500);
        }, i * 50);
      }
      
      setTimeout(() => { overlay.classList.add('show'); }, 600);
    }

    document.getElementById('surpriseCloseBtn').addEventListener('click', function() {
      document.getElementById('surpriseOverlay').classList.remove('show');
    });

    document.getElementById('surpriseOverlay').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    // ===== SIMPLE NAVIGATION FUNCTIONS =====
    function goToPage(index) {
      if (index < 0 || index >= totalPages) return;
      currentIndex = index;
      renderPage(currentIndex);
    }

    function handleNextClick() {
      // If on letter page and letter not open
      if (currentIndex === 0 && !isLetterOpen) {
        const envelope = document.getElementById('envelope');
        const openBtn = document.getElementById('openLetterBtn');
        if (envelope && !envelope.classList.contains('open')) {
          envelope.classList.add('open');
          if (openBtn) openBtn.classList.add('hidden');
          isLetterOpen = true;
          setTimeout(function() {
            if (currentIndex < totalPages - 1) {
              goToPage(currentIndex + 1);
            }
          }, 500);
          return;
        }
      }
      
      // If on last page
      if (currentIndex === totalPages - 1) {
        if (!flowersAccepted) {
          const acceptBtn = document.getElementById('acceptBtn');
          if (acceptBtn && !acceptBtn.classList.contains('accepted')) {
            acceptBtn.style.animation = 'pulse 0.5s ease 3';
            setTimeout(function() {
              acceptBtn.style.animation = '';
            }, 1500);
          }
          return;
        }
        return;
      }
      
      // Normal navigation - go to next page
      if (currentIndex < totalPages - 1) {
        goToPage(currentIndex + 1);
      }
    }

    function handlePrevClick() {
      if (currentIndex > 0) {
        goToPage(currentIndex - 1);
      }
    }

    // ===== RENDER PAGE =====
    function renderPage(index) {
      const page = allPages[index];
      if (!page) return;

      const iconHtml = `<span class="big-emoji">${page.icon}</span>`;
      const isLetterPage = (index === 0);
      const isLastPage = (index === totalPages - 1);
      const savedAnswer = userAnswers[index] || '';

      let letterHtml = '';
      if (isLetterPage) {
        letterHtml = page.body;
      }

      let flowerHtml = '';
      if (isLastPage) {
        flowerHtml = `
          <div class="flower-section">
            <div class="bouquet-container" id="bouquetContainer">
              <div class="bouquet-emoji">🌹🌷🌺🌸🌼🌻🌹</div>
            </div>
            <div class="bouquet-text">💐 A special bouquet for you, Antel Hayat 💐</div>
            <button class="accept-btn" id="acceptBtn">
              <i class="fas fa-heart"></i> Accept These Flowers <i class="fas fa-heart"></i>
            </button>
            <div class="accept-feedback" id="acceptFeedback">
              💕 Yay! You accepted! Kharoos loves you so much! 💕
            </div>
            <div class="continue-section">
              <button class="continue-btn" id="continueBtn">
                <i class="fas fa-arrow-right"></i> Continue to End <i class="fas fa-heart"></i>
              </button>
            </div>
          </div>
        `;
      }

      // Mobile next button HTML - for ALL pages except last
      let mobileNextHtml = '';
      if (!isLastPage) {
        mobileNextHtml = `
          <div class="mobile-next-section">
            <button class="mobile-next-btn" id="mobileNextBtn">
              <i class="fas fa-arrow-right"></i> Next Page <i class="fas fa-heart"></i>
            </button>
          </div>
        `;
      }

      const html = `
        <div class="page-content">
          <div class="page-icon">${iconHtml}</div>
          <h2 class="page-title">${page.title}</h2>
          <div class="page-sub">${page.sub}</div>
          <div class="page-body">
            ${isLetterPage ? letterHtml : page.body}
          </div>
          
          ${!isLetterPage && !isLastPage ? `
            <div class="answer-section">
              <input type="text" class="answer-box" id="answerInput" 
                     placeholder="✍️ Write your answer here, cutie..." 
                     value="${savedAnswer}" autocomplete="off" 
                     inputmode="text" enterkeyhint="send">
              <button class="reply-btn" id="replyBtn">
                <i class="fas fa-paper-plane"></i> Reply
              </button>
              <div class="reply-feedback" id="replyFeedback">
                <i class="fas fa-heart" style="color: #ff6b81;"></i> Kharoos got your reply! 💕
              </div>
            </div>
          ` : ''}
          
          ${mobileNextHtml}
          
          ${isLastPage ? flowerHtml : ''}
          
          ${isLastPage ? `
            <div class="restart-section">
              <button class="restart-btn" id="restartBtn">
                <i class="fas fa-redo-alt"></i> Start Over ❤️
              </button>
            </div>
          ` : ''}
          
          <div class="page-footer-note">
            <i class="fas fa-heart" style="color: #ff6b81;"></i>
            <span>page ${index+1} of ${totalPages}</span>
            <i class="fas fa-heart" style="color: #ff6b81;"></i>
          </div>
          <div class="credit-line">
            <i class="fas fa-pen-fancy"></i> made by <strong style="color: #ffb0b0;">kharoos</strong> 
            <i class="fas fa-heart" style="color: #ff6b81;"></i> for Antel Hayat
          </div>
        </div>
      `;

      container.innerHTML = html;
      pageCounter.textContent = `${index+1} / ${totalPages}`;
      
      // Get button references
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const mobileNextBtn = document.getElementById('mobileNextBtn');
      
      if (prevBtn) {
        prevBtn.disabled = (index === 0);
        const newPrev = prevBtn.cloneNode(true);
        prevBtn.parentNode.replaceChild(newPrev, prevBtn);
        newPrev.addEventListener('click', handlePrevClick);
      }
      
      if (nextBtn) {
        if (isLastPage) {
          nextBtn.disabled = !flowersAccepted;
        } else {
          nextBtn.disabled = false;
        }
        const newNext = nextBtn.cloneNode(true);
        nextBtn.parentNode.replaceChild(newNext, nextBtn);
        newNext.addEventListener('click', handleNextClick);
      }

      // Mobile Next Button - for ALL pages except last
      if (mobileNextBtn) {
        const newMobileNext = mobileNextBtn.cloneNode(true);
        mobileNextBtn.parentNode.replaceChild(newMobileNext, mobileNextBtn);
        newMobileNext.addEventListener('click', handleNextClick);
      }

      // Letter open functionality
      if (isLetterPage) {
        const openBtn = document.getElementById('openLetterBtn');
        const envelope = document.getElementById('envelope');

        if (openBtn && envelope) {
          const newOpenBtn = openBtn.cloneNode(true);
          openBtn.parentNode.replaceChild(newOpenBtn, openBtn);
          
          newOpenBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            envelope.classList.add('open');
            this.classList.add('hidden');
            isLetterOpen = true;
            const nxtBtn = document.getElementById('nextBtn');
            if (nxtBtn) nxtBtn.disabled = false;
          });

          envelope.addEventListener('click', function(e) {
            if (!isLetterOpen && (e.target === envelope || e.target.closest('.envelope-body') || e.target.closest('.envelope-flap'))) {
              envelope.classList.add('open');
              const openBtnEl = document.getElementById('openLetterBtn');
              if (openBtnEl) openBtnEl.classList.add('hidden');
              isLetterOpen = true;
              const nxtBtn = document.getElementById('nextBtn');
              if (nxtBtn) nxtBtn.disabled = false;
            }
          });
        }
      }

      // Reply button
      if (!isLetterPage && !isLastPage) {
        const replyBtn = document.getElementById('replyBtn');
        const answerInput = document.getElementById('answerInput');
        const feedback = document.getElementById('replyFeedback');

        if (replyBtn && answerInput) {
          const newReplyBtn = replyBtn.cloneNode(true);
          replyBtn.parentNode.replaceChild(newReplyBtn, replyBtn);
          
          newReplyBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const answer = answerInput.value.trim();
            if (answer) {
              userAnswers[index] = answer;
              if (feedback) {
                feedback.textContent = '💕 Kharoos got your reply! 💕';
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 2500);
              }
            } else {
              if (feedback) {
                feedback.textContent = '💋 Write something, cutie!';
                feedback.classList.add('show');
                setTimeout(() => {
                  feedback.textContent = '💕 Kharoos got your reply! 💕';
                  feedback.classList.remove('show');
                }, 2000);
              }
            }
          });

          answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              newReplyBtn.click();
            }
          });

          answerInput.addEventListener('input', function() {
            userAnswers[index] = this.value;
          });
        }
      }

      // ACCEPT BUTTON
      if (isLastPage) {
        setTimeout(function() {
          const acceptBtn = document.getElementById('acceptBtn');
          const bouquetContainer = document.getElementById('bouquetContainer');
          const acceptFeedback = document.getElementById('acceptFeedback');
          const continueBtn = document.getElementById('continueBtn');

          if (acceptBtn) {
            const newAcceptBtn = acceptBtn.cloneNode(true);
            acceptBtn.parentNode.replaceChild(newAcceptBtn, acceptBtn);
            
            newAcceptBtn.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              
              if (flowersAccepted) return;
              
              const bouquet = document.getElementById('bouquetContainer');
              if (bouquet) bouquet.classList.add('zoom-in');
              
              const feedback = document.getElementById('acceptFeedback');
              if (feedback) feedback.classList.add('show');
              
              triggerSurprise();
              
              flowersAccepted = true;
              
              this.classList.add('accepted');
              this.innerHTML = '<i class="fas fa-check"></i> Accepted! 💕';
              
              setTimeout(function() {
                const contBtn = document.getElementById('continueBtn');
                if (contBtn) contBtn.classList.add('show');
                const nxtBtn = document.getElementById('nextBtn');
                if (nxtBtn) nxtBtn.disabled = false;
              }, 1200);
              
              setTimeout(function() {
                const emoji = document.querySelector('.bouquet-emoji');
                if (emoji) emoji.style.fontSize = '7rem';
              }, 500);
            });
          }

          if (continueBtn) {
            const newContinueBtn = continueBtn.cloneNode(true);
            continueBtn.parentNode.replaceChild(newContinueBtn, continueBtn);
            
            newContinueBtn.addEventListener('click', function(e) {
              e.preventDefault();
              const feedback = document.getElementById('acceptFeedback');
              if (feedback) {
                feedback.textContent = '💕 Thank you for accepting! You made Kharoos so happy! 💕';
                feedback.classList.add('show');
              }
              const nxtBtn = document.getElementById('nextBtn');
              if (nxtBtn) nxtBtn.disabled = false;
            });
          }

          const restartBtn = document.getElementById('restartBtn');
          if (restartBtn) {
            const newRestartBtn = restartBtn.cloneNode(true);
            restartBtn.parentNode.replaceChild(newRestartBtn, restartBtn);
            
            newRestartBtn.addEventListener('click', function() {
              for (let key in userAnswers) delete userAnswers[key];
              isLetterOpen = false;
              flowersAccepted = false;
              goToPage(0);
            });
          }
        }, 50);
      }
      
      document.querySelector('.book').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Keyboard support
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') { 
        e.preventDefault();
        handlePrevClick();
      }
      else if (e.key === 'ArrowRight') { 
        e.preventDefault();
        handleNextClick();
      }
    });

    // Touch swipe support
    let touchStartX = 0;
    const bookEl = document.querySelector('.book');
    bookEl.addEventListener('touchstart', function(e) { 
      touchStartX = e.changedTouches[0].screenX; 
    }, { passive: true });
    
    bookEl.addEventListener('touchend', function(e) {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 40) {
        if (diff > 0) {
          handleNextClick();
        } else {
          handlePrevClick();
        }
      }
    }, { passive: true });

    // ===== FLOATING HEARTS =====
    function createFloatingHearts() {
      const container = document.getElementById('hearts-container');
      const heartSymbols = ['❤️', '💕', '💖', '💗', '♥️', '💘', '💝'];
      const colors = ['#ff2d55', '#ff4d6d', '#ff6b81', '#ff4757'];
      
      let heartCount = 0;
      const maxHearts = 15;
      
      function addHeart() {
        if (heartCount >= maxHearts) return;
        
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
        heart.style.animationDuration = (12 + Math.random() * 10) + 's';
        heart.style.opacity = 0.3 + Math.random() * 0.4;
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.textShadow = `0 0 20px ${heart.style.color}`;
        container.appendChild(heart);
        heartCount++;
        
        setTimeout(function() {
          if (heart.parentNode) {
            heart.remove();
            heartCount--;
          }
        }, 22000);
      }

      for (let i = 0; i < 6; i++) {
        setTimeout(addHeart, i * 200);
      }

      setInterval(addHeart, 1200);
    }

    createFloatingHearts();

    // Initial render
    renderPage(0);
  })();
</script>

</body>
</html>
